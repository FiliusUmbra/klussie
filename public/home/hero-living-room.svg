<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="presentation">
  <!--
    Placeholder hero artwork for the customer homepage.

    This is NOT photography. docs/design/ILLUSTRATION_GUIDELINES.md records that zero
    photography assets exist anywhere in this codebase, and docs/product/HOMEPAGE_DIRECTION.md
    is explicit that real sourcing is separate work that has not happened. Rather than
    hotlink a stock image (forbidden by the brief) or claim an asset Klussie does not
    own, this stands in: a calm, lived-in, daylit room in the brand's warm register,
    holding the exact frame a commissioned photograph will drop into.

    Swap procedure: replace the entries in src/home/heroImage.js. Nothing else changes.
    Drawn to be cropped — the composition survives object-fit: cover at any ratio,
    and the upper-left quadrant is deliberately quiet so overlaid text stays legible.
  -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#F6F1E7"/>
      <stop offset="55%" stop-color="#EDE5D7"/>
      <stop offset="100%" stop-color="#E0D6C4"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A87C"/>
      <stop offset="100%" stop-color="#A9885F"/>
    </linearGradient>
    <linearGradient id="daylight" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFF9EC"/>
      <stop offset="100%" stop-color="#FDEFD2"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBF7EF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F0E7D6" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B9C7B2"/>
      <stop offset="100%" stop-color="#98AC93"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.72" cy="0.34" r="0.55">
      <stop offset="0%" stop-color="#FFF6E0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF6E0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lightspill" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#FFF3D8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFF3D8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- room shell -->
  <rect width="1200" height="560" fill="url(#wall)"/>
  <rect y="392" width="1200" height="168" fill="url(#floor)"/>
  <g stroke="#8E7050" stroke-opacity="0.16" stroke-width="1.5">
    <path d="M0 428 H1200 M0 468 H1200 M0 512 H1200"/>
    <path d="M180 392 L120 560 M470 392 L440 560 M760 392 L790 560 M1030 392 L1090 560"/>
  </g>
  <rect y="386" width="1200" height="10" fill="#D8CDBA"/>

  <!-- window: the room's light source, right of centre -->
  <g>
    <rect x="712" y="74" width="330" height="304" rx="8" fill="#C8B393"/>
    <rect x="722" y="84" width="310" height="284" rx="4" fill="url(#daylight)"/>
    <g fill="#EFE0C2" opacity="0.85">
      <rect x="722" y="84" width="310" height="284"/>
    </g>
    <rect x="722" y="84" width="310" height="284" fill="url(#daylight)"/>
    <!-- soft outdoor greenery, blurred to a suggestion rather than a scene -->
    <circle cx="800" cy="300" r="86" fill="#C4D3B4" opacity="0.55"/>
    <circle cx="905" cy="322" r="70" fill="#B7CBA8" opacity="0.5"/>
    <circle cx="985" cy="292" r="54" fill="#CBD8BC" opacity="0.45"/>
    <g stroke="#C8B393" stroke-width="9">
      <path d="M877 84 V368"/>
      <path d="M722 226 H1032"/>
    </g>
    <rect x="700" y="368" width="354" height="14" rx="4" fill="#D6C4A4"/>
  </g>

  <!-- daylight falling into the room -->
  <path d="M712 378 L1042 378 L1160 560 L640 560 Z" fill="url(#lightspill)"/>
  <rect width="1200" height="560" fill="url(#bloom)"/>

  <!-- sheer curtain, left edge of the window -->
  <path d="M660 66 q28 150 -6 316 l64 0 q-30 -166 4 -316 z" fill="url(#curtain)"/>
  <path d="M1042 66 q26 150 -4 316 l58 0 q-28 -166 2 -316 z" fill="url(#curtain)" opacity="0.75"/>

  <!-- rug -->
  <ellipse cx="470" cy="500" rx="360" ry="62" fill="#E3D8C6" opacity="0.9"/>
  <ellipse cx="470" cy="500" rx="300" ry="48" fill="none" stroke="#CDBEA6" stroke-width="4"/>

  <!-- sofa: lived in, cushions not perfectly squared -->
  <g>
    <rect x="222" y="286" width="440" height="106" rx="26" fill="url(#sofa)"/>
    <rect x="236" y="356" width="412" height="70" rx="22" fill="#A8BBA2"/>
    <rect x="204" y="316" width="52" height="112" rx="22" fill="#A2B69C"/>
    <rect x="628" y="316" width="52" height="112" rx="22" fill="#A2B69C"/>
    <g>
      <rect x="272" y="300" width="92" height="82" rx="18" fill="#E8A33D" opacity="0.92" transform="rotate(-5 318 341)"/>
      <rect x="392" y="304" width="88" height="78" rx="18" fill="#F1E4CC" transform="rotate(3 436 343)"/>
      <rect x="508" y="298" width="90" height="84" rx="18" fill="#2F5B45" opacity="0.85" transform="rotate(-3 553 340)"/>
    </g>
    <!-- a throw left where somebody actually dropped it -->
    <path d="M596 356 q64 12 76 76 q-52 8 -86 -22 z" fill="#D9C3A0" opacity="0.95"/>
    <g fill="#7A6248">
      <rect x="246" y="424" width="14" height="30" rx="5"/>
      <rect x="620" y="424" width="14" height="30" rx="5"/>
    </g>
  </g>

  <!-- side table with a half-read book -->
  <g>
    <rect x="700" y="404" width="120" height="10" rx="5" fill="#8E7050"/>
    <rect x="712" y="414" width="10" height="52" rx="4" fill="#8E7050"/>
    <rect x="798" y="414" width="10" height="52" rx="4" fill="#8E7050"/>
    <rect x="726" y="386" width="70" height="18" rx="4" fill="#C8734A" opacity="0.9"/>
  </g>

  <!-- plant, near the light -->
  <g>
    <path d="M1064 400 h96 l-12 84 h-72 z" fill="#C1794E"/>
    <path d="M1060 392 h104 v14 h-104 z" fill="#D08A5E"/>
    <g fill="#3F7355">
      <path d="M1112 392 q-58 -46 -50 -122 q46 30 50 122 z"/>
      <path d="M1112 392 q56 -54 44 -128 q-46 36 -44 128 z" opacity="0.9"/>
      <path d="M1112 392 q-22 -76 18 -128 q10 66 -18 128 z" opacity="0.8"/>
    </g>
  </g>

  <!-- floor lamp -->
  <g>
    <path d="M104 232 h116 l-18 66 h-80 z" fill="#F0E2C6"/>
    <rect x="156" y="298" width="8" height="164" fill="#8E7050"/>
    <ellipse cx="160" cy="464" rx="42" ry="10" fill="#8E7050"/>
  </g>

  <!-- framed picture, quiet corner -->
  <g>
    <rect x="352" y="112" width="132" height="104" rx="6" fill="#D8CDBA"/>
    <rect x="364" y="124" width="108" height="80" rx="3" fill="#EFE6D5"/>
    <path d="M364 204 l32 -38 l26 24 l24 -32 l26 46 z" fill="#BFCFB6"/>
  </g>

  <!-- overall warmth, keeps the whole frame in one light -->
  <rect width="1200" height="560" fill="#E8A33D" opacity="0.05"/>
</svg>
